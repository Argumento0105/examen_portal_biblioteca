{% extends "base.html" %}

{% block title %}
Perfil
{% endblock %}


{% block contenido %}

<div class="contenedor">

    <h2>
        Perfil del usuario
    </h2>


    <p>

        Usuario autenticado:

        <strong>
            {{ usuario }}
        </strong>

    </p>


    <p>
        Has iniciado sesión correctamente
        en el Portal de Biblioteca.
    </p>


    <a class="boton"
       href="{{ url_for('logout') }}">

        Cerrar sesión

    </a>

</div>

{% endblock %}
